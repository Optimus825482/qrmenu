name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: merit_test
          # A non-UTC server zone: wall-clock (timestamp without time zone) bugs surface in CI.
          TZ: Europe/Istanbul
          PGTZ: Europe/Istanbul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/merit
      DATABASE_URL_TEST: postgresql://postgres:test@localhost:5432/merit_test
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789
      QR_HMAC_SECRET: ci-qr-hmac-secret-0123456789abcdef012345678
      PRINT_GATEWAY_KEY: ci-print-gateway-key
      APP_BASE_URL: http://localhost:3000
      SEED_ADMIN_PASSWORD: ci-admin-password
      TZ: Europe/Nicosia
      MERIT_DISABLE_JOBS: "1"
    defaults:
      run:
        working-directory: merit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: merit/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Create dev database
        run: psql postgresql://postgres:test@localhost:5432/postgres -c "CREATE DATABASE merit;"
      - name: Migrate dev database
        run: npx prisma migrate deploy
      - name: Migrate test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
      - run: npm run check
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: merit/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
