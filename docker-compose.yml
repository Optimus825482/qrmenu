services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_123}@postgres:5432/${POSTGRES_DB:-merit}?schema=public
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      - SESSION_SECRET=${SESSION_SECRET:-changeme_min_32_characters_secret_session_key}
      - QR_HMAC_SECRET=${QR_HMAC_SECRET:-changeme_min_32_characters_secret_qr_hmac}
      - PRINT_GATEWAY_KEY=${PRINT_GATEWAY_KEY:-changeme_print_gateway_secret_key}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-Merit!2026}
      - UPLOADS_DIR=/app/uploads
      - TZ=Europe/Nicosia
      - RUN_SEED=${RUN_SEED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app-uploads:/app/uploads

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password_123}
      - POSTGRES_DB=${POSTGRES_DB:-merit}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-merit}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  app-uploads:
