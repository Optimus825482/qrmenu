# Merit OS — nginx (on-prem birincil; bulutta aynı dosya kullanılır).
# Kurulum: sudo cp deploy/nginx/merit.conf /etc/nginx/sites-available/merit
#          sudo ln -s ../sites-available/merit /etc/nginx/sites-enabled/merit
#          sudo nginx -t && sudo systemctl reload nginx
# Alan adlarını (merit.otel.example, egitim.otel.example) ve sertifika yollarını kendi kurulumunuza göre değiştirin.
# Uygulama 127.0.0.1:3000 (eğitim: 127.0.0.1:3100) dinler; bu portları dışa açmayın.

# /q/ yolu için cömert hız sınırı (otel Wi-Fi'sinde misafirler tek NAT IP'sinden görünür).
limit_req_zone $binary_remote_addr zone=merit_q:10m rate=30r/s;

upstream merit_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream merit_egitim {
    server 127.0.0.1:3100;
    keepalive 8;
}

# ---------------------------------------------------------------- HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name merit.otel.example egitim.otel.example;

    # certbot HTTP-01 doğrulaması için (DNS-01 kullanılıyorsa zararsızdır)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------- Üretim
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name merit.otel.example;

    ssl_certificate     /etc/letsencrypt/live/merit.otel.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/merit.otel.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:MERIT_SSL:10m;
    ssl_session_timeout 1d;

    # Güvenlik başlıkları (uygulamanın kendi başlıklarına ek)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Menü görseli yüklemeleri (görsel ≤ 2 MB)
    client_max_body_size 3m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Üzerine yazılır; $proxy_add_x_forwarded_for KULLANMAYIN (IP sahteciliği).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Gerçek zamanlı olaylar (SSE): tamponlama kapalı, uzun okuma zaman aşımı.
    # (location içinde add_header kullanıldığı için üst düzey başlıklar burada tekrarlanır.)
    location ~ ^/api/(sse|q/[^/]+/events)$ {
        proxy_pass http://merit_app;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Misafir QR yolu: yalnız cömert hız sınırı
    location /q/ {
        limit_req zone=merit_q burst=60 nodelay;
        proxy_pass http://merit_app;
    }

    # Sürümlü statik dosyalar: değişmez
    location /_next/static/ {
        proxy_pass http://merit_app;
        proxy_cache off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://merit_app;
        proxy_read_timeout 60s;
    }
}

# ---------------------------------------------------------------- Eğitim örneği (ayrı veritabanı, port 3100)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name egitim.otel.example;

    ssl_certificate     /etc/letsencrypt/live/merit.otel.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/merit.otel.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 3m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location ~ ^/api/(sse|q/[^/]+/events)$ {
        proxy_pass http://merit_egitim;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://merit_egitim;
    }
}
