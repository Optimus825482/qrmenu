# Bakım sayfası: her adres 503 + logolu güncelleme sayfası döner; yalnız logolar 200 ile sunulur.
# 503 + Retry-After arama motorlarına "geçici" der; sayfadaki /api/health sorgusu da burada HTML (JSON değil)
# aldığı için sayfa, uygulama geri gelene kadar beklemeyi sürdürür.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location /brand/hotels/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        return 503;
    }

    error_page 503 /index.html;

    location = /index.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "15" always;
    }
}
