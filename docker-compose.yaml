# Tek compose dosyası (Coolify / VPS). Gizli değerler ortamdan gelir; varsayılan yoktur.
# Eksik zorunlu değişken varsa `docker compose up` açık bir hata verir.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}?schema=public
      APP_BASE_URL: ${APP_BASE_URL:?required}
      SESSION_SECRET: ${SESSION_SECRET:?required}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:?required}
      PRINT_GATEWAY_KEY: ${PRINT_GATEWAY_KEY:?required}
      # Yalnız ilk admin oluşturulurken gerekir (RUN_SEED=true iken zorunlu); boş bırakılabilir.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      UPLOADS_DIR: /app/uploads
      TZ: Europe/Nicosia
      # Referans veri + admin: ilk kurulumda true yapın, sonra false. Demo veri ayrı bayraktır.
      RUN_SEED: ${RUN_SEED:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      # Yalnız HTTP ile erişilen test ortamı için false; gerçek kurulumda boş bırakın.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # Yalnız ilk kurulumda bir kez true yapın (20 outlet + menü); sonra false. Mevcut menüler hiçbir zaman silinmez.
      SYNC_MERIT_MENUS: ${SYNC_MERIT_MENUS:-false}
      MERIT_MENUS_FORCE_RESET: ${MERIT_MENUS_FORCE_RESET:-false}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app-uploads:/app/uploads
    # İmajda curl/wget yok; node 22 ile /api/health (200 değilse başarısız). Açılışta migrasyon süresi için start_period geniştir.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  app-uploads:
