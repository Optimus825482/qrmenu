# Tek compose dosyası (Coolify / VPS). Gizli değerler ortamdan gelir; varsayılan yoktur.
# Eksik zorunlu değişken varsa `docker compose up` açık bir hata verir.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}?schema=public
      APP_BASE_URL: ${APP_BASE_URL:?required}
      SESSION_SECRET: ${SESSION_SECRET:?required}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:?required}
      PRINT_GATEWAY_KEY: ${PRINT_GATEWAY_KEY:?required}
      # Yalnız ilk admin oluşturulurken gerekir (RUN_SEED=true iken zorunlu); boş bırakılabilir.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      UPLOADS_DIR: /app/uploads
      TZ: Europe/Nicosia
      # Referans veri + admin: ilk kurulumda true yapın, sonra false. Demo veri ayrı bayraktır.
      RUN_SEED: ${RUN_SEED:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      # Yalnız HTTP ile erişilen test ortamı için false; gerçek kurulumda boş bırakın.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app-uploads:/app/uploads

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  app-uploads:
