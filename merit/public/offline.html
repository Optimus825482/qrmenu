<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Çevrimdışı - Merit</title>
  <style>
    :root {
      --bg: #0f0d0a;
      --card-bg: #1c1813;
      --text: #f5f1e8;
      --text-muted: #9e9587;
      --accent: #c9a24a;
      --border: rgba(201, 162, 74, 0.25);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(20px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) calc(20px + env(safe-area-inset-left, 0px));
      text-align: center;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: rgba(201, 162, 74, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 32px;
      height: 32px;
      stroke: var(--accent);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--accent);
    }
    p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #0f0d0a;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      width: 100%;
      min-height: 48px;
      touch-action: manipulation;
      transition: opacity 0.2s ease;
    }
    .btn:active {
      opacity: 0.85;
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    </div>
    <h1>Bağlantı Kesildi</h1>
    <p>Şu anda çevrimdışısınız. İnternet bağlantınız yeniden kurulduğunda menüye ve siparişlerinize devam etmek için sayfayı yenileyebilirsiniz.</p>
    <button class="btn" onclick="window.location.reload()">Tekrar Dene</button>
  </div>
  <script>
    window.addEventListener('online', function() {
      var btn = document.querySelector('.btn');
      if (btn) btn.textContent = 'Bağlantı sağlandı, yenileniyor...';
      setTimeout(function() { window.location.reload(); }, 300);
    });
  </script>
</body>
</html>
