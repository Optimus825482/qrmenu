<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#faf7f0">
  <title>Merit Hotels</title>
  <style>
    :root {
      --bg: #faf7f0;
      --text: #1f2a44;
      --text-muted: #5f6678;
      --gold: #b8913a;
      --line: rgba(184, 145, 58, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
      background: radial-gradient(ellipse at top, #ffffff 0%, var(--bg) 65%);
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(28px + env(safe-area-inset-top, 0px)) 20px calc(28px + env(safe-area-inset-bottom, 0px));
      text-align: center;
    }
    .logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 4vw, 32px);
      direction: ltr; /* Arapçada (rtl) da logo sırası Royal → Premium → Diamond kalır */
      animation: breathe 3.2s ease-in-out infinite;
    }
    .logos img {
      width: clamp(80px, 24vw, 140px);
      height: auto;
      filter: drop-shadow(0 8px 18px rgba(31, 42, 68, 0.18));
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.025); }
    }
    .divider { width: 72px; height: 1px; background: var(--line); margin: 30px auto 24px; }
    h1 { font-size: 20px; font-weight: 600; color: var(--text); }
    p { margin: 12px auto 0; max-width: 460px; font-size: 15px; line-height: 1.65; color: var(--text-muted); }
    p.en { margin-top: 18px; font-size: 13px; font-style: italic; opacity: 0.85; }
    .thanks { margin-top: 16px; font-size: 15px; font-weight: 600; color: var(--gold); }
    /* Cihaz çevrimdışı görünümü: sorun misafirin bağlantısında; teşekkür satırı yok, Wi-Fi simgesi var. */
    .wifi { display: none; width: 44px; height: 44px; margin: 0 auto 14px; color: var(--text-muted); }
    body[data-reason="offline"] .wifi { display: block; }
    body[data-reason="offline"] .thanks { display: none; }
    .dots { margin-top: 26px; display: flex; gap: 8px; justify-content: center; }
    .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: dot 1.4s ease-in-out infinite; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
    .btn {
      margin-top: 28px;
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--line);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 12px;
      min-height: 46px;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 2px 8px rgba(31, 42, 68, 0.06);
    }
    .btn:active { transform: scale(0.98); }
    @media (prefers-reduced-motion: reduce) {
      .logos, .dots span { animation: none; }
    }
  </style>
</head>
<!-- data-reason: "update" = bizim taraf (deploy); service worker ağ hatasında "offline" yapar = misafirin bağlantısı. -->
<body data-reason="update">
  <div class="logos">
    <img src="/brand/hotels/royal-transparent.webp" alt="Merit Royal Hotel & Casino & Spa">
    <img src="/brand/hotels/premium-transparent.webp" alt="Merit Royal Premium Hotel & Casino & Spa">
    <img src="/brand/hotels/diamond-transparent.webp" alt="Merit Royal Diamond Hotel & Spa">
  </div>

  <div class="divider"></div>

  <svg class="wifi" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5 12a10 10 0 0 1 14 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/><path d="M3 3l18 18"/>
  </svg>
  <h1 id="title">Kısa süreli güncelleme</h1>
  <p id="msg">Sizlere daha iyi hizmet verebilmek adına, son teknolojik gelişmeler doğrultusunda sistemimizde kısa süreli bir güncelleme yapılmaktadır. Birkaç saniye sonra istediğiniz alana ulaşabileceksiniz.</p>
  <p class="en" id="msg-en" dir="ltr" lang="en"></p>
  <div class="thanks" id="thanks">Anlayışınız için teşekkür ederiz.</div>

  <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
  <button class="btn" id="btn" type="button" onclick="window.location.reload()">Şimdi yenile</button>

  <script>
    (function () {
      // Misafir menüsünün 9 dili (src/lib/i18n/locales.ts ile aynı). o*: cihaz çevrimdışıyken.
      var T = {
        tr: { title: 'Kısa süreli güncelleme', msg: 'Sizlere daha iyi hizmet verebilmek adına, son teknolojik gelişmeler doğrultusunda sistemimizde kısa süreli bir güncelleme yapılmaktadır. Birkaç saniye sonra istediğiniz alana ulaşabileceksiniz.', thanks: 'Anlayışınız için teşekkür ederiz.', oTitle: 'Cihazınız internete bağlı değil', oMsg: 'Lütfen Wi-Fi veya mobil veri bağlantınızı kontrol edin. Bağlantınız geri geldiğinde sayfa kendiliğinden açılacaktır.', btn: 'Şimdi yenile' },
        en: { title: 'Brief system update', msg: 'To serve you better, we are carrying out a brief update to our system in line with the latest technological developments. You will be able to reach the page you requested in a few seconds.', thanks: 'Thank you for your understanding.', oTitle: 'Your device is not connected to the internet', oMsg: 'Please check your Wi-Fi or mobile data connection. The page will open automatically as soon as your connection is back.', btn: 'Refresh now' },
        de: { title: 'Kurzes Systemupdate', msg: 'Um Ihnen einen noch besseren Service zu bieten, führen wir entsprechend den neuesten technologischen Entwicklungen ein kurzes Update unseres Systems durch. In wenigen Sekunden gelangen Sie zur gewünschten Seite.', thanks: 'Vielen Dank für Ihr Verständnis.', oTitle: 'Ihr Gerät ist nicht mit dem Internet verbunden', oMsg: 'Bitte überprüfen Sie Ihre WLAN- oder Mobilfunkverbindung. Die Seite öffnet sich automatisch, sobald die Verbindung wiederhergestellt ist.', btn: 'Jetzt aktualisieren' },
        ru: { title: 'Кратковременное обновление', msg: 'Чтобы обслуживать вас ещё лучше, мы проводим кратковременное обновление системы в соответствии с последними технологическими достижениями. Через несколько секунд вы сможете перейти на нужную страницу.', thanks: 'Благодарим за понимание.', oTitle: 'Ваше устройство не подключено к интернету', oMsg: 'Пожалуйста, проверьте подключение к Wi-Fi или мобильному интернету. Страница откроется автоматически, как только соединение восстановится.', btn: 'Обновить' },
        ar: { title: 'تحديث قصير للنظام', msg: 'لنقدّم لكم خدمة أفضل، نُجري حاليًا تحديثًا قصيرًا لنظامنا مواكبةً لأحدث التطورات التقنية. ستتمكنون من الوصول إلى الصفحة المطلوبة خلال ثوانٍ قليلة.', thanks: 'شكرًا لتفهّمكم.', oTitle: 'جهازك غير متصل بالإنترنت', oMsg: 'يرجى التحقق من اتصال Wi-Fi أو بيانات الجوال. ستُفتح الصفحة تلقائيًا فور عودة الاتصال.', btn: 'تحديث الآن' },
        fr: { title: 'Courte mise à jour du système', msg: 'Afin de mieux vous servir, nous effectuons une courte mise à jour de notre système conformément aux dernières avancées technologiques. Vous pourrez accéder à la page demandée dans quelques secondes.', thanks: 'Merci de votre compréhension.', oTitle: 'Votre appareil n\u2019est pas connecté à Internet', oMsg: 'Veuillez vérifier votre connexion Wi-Fi ou vos données mobiles. La page s\u2019ouvrira automatiquement dès le rétablissement de votre connexion.', btn: 'Actualiser' },
        el: { title: 'Σύντομη ενημέρωση συστήματος', msg: 'Για να σας εξυπηρετούμε καλύτερα, πραγματοποιούμε μια σύντομη ενημέρωση του συστήματός μας σύμφωνα με τις τελευταίες τεχνολογικές εξελίξεις. Σε λίγα δευτερόλεπτα θα μπορείτε να μεταβείτε στη σελίδα που ζητήσατε.', thanks: 'Σας ευχαριστούμε για την κατανόηση.', oTitle: 'Η συσκευή σας δεν είναι συνδεδεμένη στο διαδίκτυο', oMsg: 'Ελέγξτε τη σύνδεση Wi-Fi ή τα δεδομένα κινητής. Η σελίδα θα ανοίξει αυτόματα μόλις αποκατασταθεί η σύνδεσή σας.', btn: 'Ανανέωση' },
        it: { title: 'Breve aggiornamento del sistema', msg: 'Per offrirvi un servizio sempre migliore, stiamo effettuando un breve aggiornamento del nostro sistema in linea con le più recenti innovazioni tecnologiche. Tra pochi secondi potrete accedere alla pagina richiesta.', thanks: 'Grazie per la comprensione.', oTitle: 'Il tuo dispositivo non è connesso a Internet', oMsg: 'Controlla la connessione Wi-Fi o i dati mobili. La pagina si aprirà automaticamente non appena la connessione sarà ripristinata.', btn: 'Aggiorna ora' },
        pt: { title: 'Breve atualização do sistema', msg: 'Para melhor o servir, estamos a realizar uma breve atualização do nosso sistema, de acordo com os mais recentes avanços tecnológicos. Dentro de alguns segundos poderá aceder à página pretendida.', thanks: 'Obrigado pela sua compreensão.', oTitle: 'O seu dispositivo não está ligado à Internet', oMsg: 'Verifique a sua ligação Wi-Fi ou os dados móveis. A página abrirá automaticamente assim que a ligação for restabelecida.', btn: 'Atualizar agora' }
      };

      // Dil sırası: ?lang= (test) → misafirin menüde seçtiği dil (merit_lang çerezi) → cihaz dili → İngilizce.
      function pickLang() {
        var tries = [];
        try { tries.push(new URLSearchParams(window.location.search).get('lang')); } catch (e) {}
        var m = document.cookie.match(/(?:^|;\s*)merit_lang=([^;]+)/);
        if (m) tries.push(decodeURIComponent(m[1]));
        var nav = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
        for (var i = 0; i < nav.length; i++) tries.push(nav[i]);
        for (var j = 0; j < tries.length; j++) {
          var code = String(tries[j] || '').toLowerCase().split(/[-_]/)[0];
          if (Object.prototype.hasOwnProperty.call(T, code)) return code;
        }
        return 'en';
      }

      var lang = pickLang();
      var t = T[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

      var title = document.getElementById('title');
      var msg = document.getElementById('msg');
      var msgEn = document.getElementById('msg-en');
      document.getElementById('thanks').textContent = t.thanks;
      document.getElementById('btn').textContent = t.btn;

      // Neden ayrımı: "update" = sunucumuz cevap verdi ama uygulama kapalı (deploy, bizim taraf);
      // "offline" = hiç cevap gelmedi (misafirin interneti yok). İlk değer service worker'dan (body
      // data-reason) gelir, sonra her /api/health denemesiyle güncellenir. Ana dil İngilizce değilse
      // altta küçük İngilizce satır da durur (dili listede olmayan misafirler için).
      var reason = document.body.getAttribute('data-reason') === 'offline' ? 'offline' : 'update';
      function setReason(next) {
        reason = next;
        document.body.setAttribute('data-reason', next);
        render();
      }
      function render() {
        var offline = reason === 'offline' || navigator.onLine === false;
        if (offline) document.body.setAttribute('data-reason', 'offline');
        title.textContent = offline ? t.oTitle : t.title;
        msg.textContent = offline ? t.oMsg : t.msg;
        msgEn.textContent = lang === 'en' ? '' : (offline ? T.en.oMsg : T.en.msg);
        msgEn.style.display = lang === 'en' ? 'none' : '';
      }

      // 3 sn arayla /api/health sorulur:
      //  - JSON yanıt (uygulamanın kendisi; 503 olsa da sayfa açılabilir) → sayfa yenilenir;
      //  - başka yanıt (proxy/bakım sayfası: "no available server", 502/503 HTML) → bizim taraf, "update";
      //  - hiç yanıt yok (ağ hatası) → misafirin bağlantısı, "offline".
      var reloading = false;
      function check() {
        if (reloading) return;
        if (navigator.onLine === false) { setReason('offline'); return; }
        fetch('/api/health', { cache: 'no-store' })
          .then(function (r) {
            var fromApp = (r.headers.get('content-type') || '').indexOf('application/json') !== -1;
            if (fromApp && !reloading) { reloading = true; window.location.reload(); return; }
            setReason('update');
          })
          .catch(function () { setReason('offline'); });
      }

      render();
      window.addEventListener('online', check);
      window.addEventListener('offline', function () { setReason('offline'); });
      setInterval(check, 3000);
      check();
    })();
  </script>
</body>
</html>
