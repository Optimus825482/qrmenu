<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MENNN · Yönetim Paneli Prototipi · Merit Royal QR & Minibar Platformu</title>
<style>
:root{
  --navy:#0c2038; --side:#0d2740; --side2:#153b5e; --gold:#c9a45c; --gold2:#a97c33;
  --ink:#1a2634; --muted:#62748a; --line:#dfe7f0; --soft:#f6f9fc; --bg:#eef2f7;
  --blue:#1d6fb8; --blue-soft:#eaf3fb; --ok:#18855a; --ok-soft:#e9f7f0;
  --warn:#b8791a; --warn-soft:#fdf4e3; --err:#b6382c; --err-soft:#fdeeec;
  --violet:#6d4bb5; --violet-soft:#f1ecfb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 "Segoe UI",Tahoma,Verdana,sans-serif}
a{color:var(--blue);text-decoration:none}
.app{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.side{width:264px;flex:0 0 264px;background:linear-gradient(180deg,var(--side),#0a1e33);color:#c9d8e6;display:flex;flex-direction:column}
.side .brand{padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.side .brand b{display:block;color:#fff;font-size:16px;letter-spacing:.16em}
.side .brand span{font-size:11px;color:var(--gold);letter-spacing:.1em}
.side nav{padding:10px 8px 24px;overflow:auto}
.side .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7d97b1;padding:12px 10px 5px}
.side a.nav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;color:#c9d8e6;font-size:12.8px}
.side a.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.side a.nav.on{background:var(--side2);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.side a.nav .ic{width:16px;text-align:center;opacity:.9;font-size:12px}
.side a.nav .n{margin-left:auto;background:rgba(255,255,255,.14);border-radius:9px;padding:0 6px;font-size:10.5px}
/* ---------- main ---------- */
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.top h1{font-size:15.5px;margin:0;font-weight:600}
.crumb{font-size:11.5px;color:var(--muted)}
.top .sp{flex:1}
.pill{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--muted);background:var(--soft);white-space:nowrap}
.pill.ok{border-color:#bfe3d1;background:var(--ok-soft);color:#0f6a45}
.pill.warn{border-color:#f0dcb2;background:var(--warn-soft);color:#8c5c12}
.pill.err{border-color:#f3cdc7;background:var(--err-soft);color:#93291e}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600}
.wrap{padding:18px 20px 40px;max-width:1500px}
/* ---------- blocks ---------- */
.h2{font-size:14px;font-weight:600;margin:0 0 4px}
.h3{font-size:12.5px;font-weight:600;margin:16px 0 8px;color:#2b3f57}
.sub{color:var(--muted);font-size:11.8px;margin:0 0 14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px}
.card.tight{padding:11px 12px}
.card .ct{font-size:12.5px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:7px}
.kpi .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.kpi .v{font-size:22px;font-weight:700;color:var(--navy);line-height:1.15;margin-top:3px}
.kpi .u{font-size:11px;color:var(--muted)}
.kpi{border-top:3px solid var(--blue)}
.kpi.gold{border-top-color:var(--gold2)} .kpi.ok{border-top-color:var(--ok)}
.kpi.violet{border-top-color:var(--violet)} .kpi.warn{border-top-color:var(--warn)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{background:var(--soft);text-align:left;font-weight:600;color:#33475f;padding:7px 9px;border-bottom:1px solid var(--line);font-size:11.2px;letter-spacing:.02em;white-space:nowrap}
table.t td{padding:7px 9px;border-bottom:1px solid #eef3f8;vertical-align:middle}
table.t tr:hover td{background:#fbfdff}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t td.ctr{text-align:center}
.tag{display:inline-block;font-size:10.6px;border-radius:5px;padding:2px 7px;border:1px solid var(--line);background:var(--soft);color:#42566d;white-space:nowrap}
.tag.ok{border-color:#bfe3d1;background:var(--ok-soft);color:#0f6a45}
.tag.warn{border-color:#f0dcb2;background:var(--warn-soft);color:#8c5c12}
.tag.err{border-color:#f3cdc7;background:var(--err-soft);color:#93291e}
.tag.blue{border-color:#c5ddf3;background:var(--blue-soft);color:#14568d}
.tag.violet{border-color:#d9cdf5;background:var(--violet-soft);color:#543a92}
.tag.gold{border-color:#ecdcb6;background:#fbf6ea;color:#8a6519}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer;color:#2b3f57}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:#13324f}
.btn.gold{background:var(--gold2);border-color:var(--gold2);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:3px 9px;font-size:11.2px}
.btn.link{border:none;background:none;color:var(--blue);padding:2px 4px}
input,select,textarea{font:inherit;font-size:12.2px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);width:100%}
label.f{display:block;font-size:11.2px;color:var(--muted);margin-bottom:3px}
.fld{margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:130px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.bar .fld{margin:0}
.bar .fld select,.bar .fld input{min-width:170px}
.note{border-left:3px solid var(--blue);background:var(--blue-soft);padding:9px 12px;border-radius:0 7px 7px 0;font-size:12px;margin:0 0 12px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.note.violet{border-color:var(--violet);background:var(--violet-soft)}
.note.gold{border-color:var(--gold2);background:#fbf6ea}
.note b{color:var(--navy)}
ul.ck{list-style:none;padding:0;margin:0}
ul.ck li{position:relative;padding-left:20px;margin-bottom:6px;font-size:12.2px}
ul.ck li:before{content:"✓";position:absolute;left:0;top:0;color:var(--ok);font-weight:700}
ul.ck.no li:before{content:"✕";color:var(--err)}
.tree{font-size:12.4px}
.tree div{padding:5px 8px;border-radius:6px;display:flex;gap:8px;align-items:center}
.tree div:hover{background:var(--soft)}
.tree .l1{font-weight:600}
.tree .l2{padding-left:22px;color:#3b5068}
.tree .l3{padding-left:44px;color:#54697f}
.tree .l4{padding-left:66px;color:#68798d}
.steps{display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:11.8px}
.steps .s{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:4px 9px}
.steps .s.on{border-color:#c5ddf3;background:var(--blue-soft);color:#14568d;font-weight:600}
.steps .ar{color:#a9b8c8}
.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.12);vertical-align:-2px}
.prog{height:7px;background:#e9eff6;border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue)}
.mono{font-family:Consolas,monospace;font-size:11.5px}
.hidden{display:none!important}
.foot{color:var(--muted);font-size:11.2px;padding:14px 20px;border-top:1px solid var(--line);background:#fff}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;animation:pul 1.4s infinite}
@keyframes pul{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:7px}
.room{border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-size:11.4px;background:#fff}
.room b{font-size:12px}
.room.done{border-color:#bfe3d1;background:var(--ok-soft)}
.room.act{border-color:#c5ddf3;background:var(--blue-soft);box-shadow:0 0 0 2px #dbeaf8 inset}
.room.dnd{border-color:#f0dcb2;background:var(--warn-soft)}
.room.pers{border-color:#d9cdf5;background:var(--violet-soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.4px;color:var(--muted);margin-top:10px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
@media (max-width:1150px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

function addFloor(){
  const no=parseInt(document.getElementById('nfNo').value,10);
  const nm=document.getElementById('nfName').value || (no+'. Kat');
  const sup=document.getElementById('nfSup').value;
  if(!no){ toast('Kat numarası giriniz.'); return; }
  if(FLOORS.some(f=>f.hotel===S.hotel && f.no===no)){ toast('Bu kat numarası zaten tanımlı.'); return; }
  FLOORS.push({id:S.hotel+'-F'+no, hotel:S.hotel, no:no, name:nm, sup:sup});
  S.floor=no; S.toast='Kat eklendi'; render(); toast(nm+' eklendi.');
}

function buildNav(){
  document.getElementById('nav').innerHTML = NAV.map(x=> x.grp
    ? '<div class="grp">'+x.grp+'</div>'
    : '<a class="nav" data-v="'+x.v+'" href="#/'+x.v+'"><span class="ic">'+x.ic+'</span>'+x.t+(x.n?'<span class="n">'+x.n+'</span>':'')+'</a>'
  ).join('');
}
function go(v){ location.hash='#/'+v; }
function current(){ return (location.hash||'').replace('#/','') || 'dashboard'; }
function render(){
  const v=current(), fn=VIEWS[v]||vDashboard;
  stopLive();
  document.getElementById('view').innerHTML = fn();
  document.getElementById('vtitle').textContent = (NAV.find(x=>x.v===v)||{t:'Genel Bakış'}).t;
  document.getElementById('vcrumb').textContent = 'Sistem Yöneticisi Paneli · prototip · '+HN(S.hotel)+' bağlamı';
  document.querySelectorAll('#nav a.nav').forEach(a=>a.classList.toggle('on', a.dataset.v===v));
  window.scrollTo(0,0);
  if(v==='command') startLive();
  var _o=document.getElementById('ovf'); if(_o) _o.setAttribute('data-view', v+' ok');
}
function tickClock(){
  const d=new Date();
  document.getElementById('clock').textContent = d.toLocaleDateString('tr-TR')+' '+d.toTimeString().slice(0,5);
}
buildNav();
window.addEventListener('hashchange', render);
render();
tickClock(); setInterval(tickClock, 20000);
