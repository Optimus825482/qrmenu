<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MENNN XP · Sistem Yöneticisi (Alternatif Arayüz)</title>
<style>
*{box-sizing:border-box;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font:11px Tahoma,'Segoe UI',Verdana,sans-serif;color:#000}
/* ---------- masaüstü ---------- */
#desktop{position:absolute;inset:0;overflow:hidden;
  background:linear-gradient(180deg,#245edb 0%,#3f8cf3 38%,#63a8e8 48%,#5aa02c 54%,#3d7a1e 100%)}
#desktop.theme-green{background:linear-gradient(180deg,#1f6f4a 0%,#2f9e63 40%,#7dbb4a 52%,#3d7a1e 100%)}
#desktop.theme-slate{background:linear-gradient(180deg,#3b4a5a 0%,#5a7186 45%,#6b7f92 52%,#42525f 100%)}
#desktop.theme-dark{background:linear-gradient(180deg,#101821 0%,#22303e 50%,#1c2a36 100%)}
#wallpaperText{position:absolute;right:18px;bottom:38px;color:rgba(255,255,255,.75);font-size:11px;letter-spacing:.08em;text-shadow:1px 1px 2px rgba(0,0,0,.4)}
/* ---------- simgeler ---------- */
.dicon{position:absolute;width:86px;padding:6px 2px;text-align:center;cursor:pointer;border:1px dotted transparent}
.dicon .ic{font-size:30px;line-height:1;filter:drop-shadow(1px 2px 2px rgba(0,0,0,.45))}
.dicon .lb{color:#fff;text-shadow:1px 1px 2px rgba(0,0,0,.65);margin-top:4px;font-size:11px;line-height:1.25;word-break:break-word}
.dicon.sel .lb{background:#316ac5;outline:1px dotted #fff}
.dicon:hover .lb{background:rgba(49,106,197,.55)}
.dicon.short:after{content:"↗";position:absolute;left:14px;top:12px;font-size:11px;color:#fff;text-shadow:0 0 3px #000}
.dicon.dragging{opacity:.5}
/* ---------- pencereler ---------- */
.win{position:absolute;min-width:320px;background:#ece9d8;border:1px solid #0831d9;border-radius:7px 7px 3px 3px;
  box-shadow:3px 4px 14px rgba(0,0,0,.45);display:flex;flex-direction:column}
.win.max{border-radius:0}
.tbar{height:26px;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:6px;padding:0 4px 0 6px;cursor:move;
  background:linear-gradient(180deg,#0997ff 0%,#0053ee 10%,#0050ee 45%,#003bd8 90%,#0030c0 100%);color:#fff;font-weight:bold;font-size:11px;text-shadow:1px 1px 1px #0f1089}
.tbar .ic{font-size:13px}
.tbar .sp{flex:1}
.tbtn{width:21px;height:19px;border-radius:3px;border:1px solid #fff;color:#fff;background:linear-gradient(180deg,#7da5ec,#2a5cd0);
  font:bold 10px Tahoma;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.tbtn:hover{filter:brightness(1.2)}
.tbtn.x{background:linear-gradient(180deg,#f19b7f,#d6491f)}
.wbody{flex:1 1 auto;overflow:auto;background:#fff;border:1px solid #8ba0c8;margin:2px;padding:8px;user-select:text}
.wfoot{height:20px;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:10px;color:#444;background:#ece9d8;border-top:1px solid #d4d0c8}
.win.min{display:none}
.win .resize{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,#9aa7bd 50%)}
/* ---------- xp kontrolleri ---------- */
.xbtn{font:11px Tahoma;padding:3px 12px;border:1px solid #003c74;border-radius:3px;cursor:pointer;
  background:linear-gradient(180deg,#fff,#ecebe5 86%,#d8d0c4)}
.xbtn:hover{box-shadow:inset 0 0 0 2px #fff8cf}
.xbtn.pri{font-weight:bold}
.xbtn:disabled{color:#97948f;border-color:#a0a0a0;cursor:default}
table.xt{width:100%;border-collapse:collapse;font-size:11px}
table.xt th{background:#ece9d8;border:1px solid #d4d0c8;padding:3px 5px;text-align:left;font-weight:bold;color:#3a3a3a}
table.xt td{border:1px solid #e4e1da;padding:3px 5px;background:#fff}
table.xt tr:hover td{background:#e8f0fb}
input.xin,select.xin{font:11px Tahoma;padding:2px 4px;border:1px solid #7f9db9;background:#fff;width:100%}
.fld{margin-bottom:7px}
label.fl{display:block;color:#3a3a3a;margin-bottom:2px}
.chip{display:inline-block;border:1px solid #a9b7cf;background:#eef3fb;border-radius:2px;padding:1px 5px;margin:1px 2px 1px 0;font-size:10px;color:#1c3f7a}
.tag{display:inline-block;font-size:10px;border:1px solid #c9c4b8;background:#f3f1e7;padding:1px 5px;border-radius:2px;color:#4a463c}
.tag.ok{border-color:#7fbf7f;background:#e6f6e6;color:#1c6b1c}
.tag.warn{border-color:#e2c46b;background:#fdf4dc;color:#7a5a10}
.tag.err{border-color:#e2a09b;background:#fdeae8;color:#8c2318}
.note{border:1px solid #c8d4e8;background:#eef4fd;padding:5px 7px;margin-bottom:8px;font-size:11px}
.muted{color:#6b6b6b}
.h3{font:bold 12px Tahoma;color:#0a246a;margin:10px 0 5px}
.h3:first-child{margin-top:0}
/* ---------- görev çubuğu ---------- */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:30px;display:flex;align-items:center;gap:4px;padding:0 4px;
  background:linear-gradient(180deg,#3168d5 0%,#4993e6 8%,#2157c8 45%,#1941a5 100%);z-index:5000}
#startBtn{height:24px;padding:0 22px 0 8px;border:none;border-radius:0 12px 12px 0;cursor:pointer;color:#fff;font:bold italic 13px Tahoma;
  display:flex;align-items:center;gap:5px;background:linear-gradient(180deg,#5eac56 0%,#3c873c 45%,#2f6e2f 100%);text-shadow:1px 1px 1px #17421a}
#startBtn:hover{filter:brightness(1.1)}
#tasks{flex:1;display:flex;gap:3px;overflow:hidden}
.task{height:22px;min-width:120px;max-width:190px;border:1px solid #1c3f94;border-radius:2px;padding:0 6px;color:#fff;font-size:10.5px;
  display:flex;align-items:center;gap:5px;cursor:pointer;background:linear-gradient(180deg,#4a83e0,#2b5bc4);white-space:nowrap;overflow:hidden}
.task.on{background:linear-gradient(180deg,#1c3f94,#16347e);font-weight:bold}
#tray{height:24px;display:flex;align-items:center;gap:6px;padding:0 8px;border-left:1px solid #16408f;color:#fff;font-size:10.5px;
  background:linear-gradient(180deg,#1290e9 0%,#0b64c8 100%);border-radius:2px}
/* ---------- başlat menüsü ---------- */
#startMenu{position:absolute;left:0;bottom:30px;width:400px;display:none;z-index:6000;border:1px solid #0831d9;border-radius:6px 6px 0 0;overflow:hidden;box-shadow:3px -2px 14px rgba(0,0,0,.45)}
#startMenu.open{display:block}
.smHead{height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;color:#fff;font-size:12px;
  background:linear-gradient(180deg,#1868d6,#0b3fa8);border-bottom:2px solid #f8b62c}
.smHead .av{width:28px;height:28px;border-radius:3px;background:#fff;color:#0b3fa8;display:flex;align-items:center;justify-content:center;font-weight:bold}
.smBody{display:flex;background:#fff}
.smLeft{width:58%;padding:6px 0;max-height:380px;overflow:auto;border-right:1px solid #d4d0c8}
.smRight{width:42%;background:linear-gradient(180deg,#d3e5fa,#b6d0f0);padding:6px 0}
.smItem{display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer;font-size:11.5px}
.smItem:hover{background:#316ac5;color:#fff}
.smItem .ic{width:18px;text-align:center;font-size:14px}
.smItem .pin{margin-left:auto;font-size:9px;color:#7a8aa8;border:1px solid #c6d2e4;border-radius:2px;padding:0 4px;background:#f2f6fc}
.smItem:hover .pin{background:rgba(255,255,255,.25);color:#fff}
.smCat{font:bold 10.5px Tahoma;color:#0a246a;padding:6px 10px 2px;background:#f2f6fc;border-top:1px solid #e2e8f2}
.smRight .smItem{color:#12346e}
.smFoot{height:26px;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 12px;color:#fff;font-size:11px;
  background:linear-gradient(180deg,#1868d6,#0b3fa8)}
/* ---------- sağ tuş menüsü ---------- */
#ctxMenu{position:absolute;display:none;z-index:7000;background:#fff;border:1px solid #8ba0c8;box-shadow:2px 2px 8px rgba(0,0,0,.35);min-width:190px;padding:2px}
#ctxMenu .ci{padding:5px 10px;cursor:pointer;font-size:11px;display:flex;gap:7px;align-items:center}
#ctxMenu .ci:hover{background:#316ac5;color:#fff}
#ctxMenu .sep{height:1px;background:#d4d0c8;margin:2px 4px}
#ctxMenu .ci.dis{color:#a0a0a0;cursor:default}
#ctxMenu .ci.dis:hover{background:none;color:#a0a0a0}
/* ---------- onay penceresi ---------- */
#dlgWrap{position:absolute;inset:0;display:none;z-index:9000;background:rgba(0,0,0,.18)}
#dlg{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);min-width:340px;background:#ece9d8;border:1px solid #0831d9;border-radius:7px 7px 3px 3px;box-shadow:4px 5px 18px rgba(0,0,0,.5)}
#dlg .tbar{cursor:default}
#dlg .bd{padding:14px;display:flex;gap:12px;font-size:11.5px;background:#fff;border:1px solid #8ba0c8;margin:2px}
#dlg .bd .ic{font-size:28px}
#dlg .ft{padding:8px;display:flex;justify-content:flex-end;gap:8px;background:#ece9d8}
/* ---------- Android görünümü ---------- */
#android{position:absolute;inset:0;display:none;flex-direction:column;background:#eef1f5;z-index:8000}
#android.on{display:flex}
.aTop{height:24px;background:#0b1929;color:#cfe0ee;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:10px}
.aBar{background:#0b57d0;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.aBar b{font-size:15px}
.aBar .sp{flex:1}
.aSearch{margin:10px 12px;background:#fff;border:1px solid #d7dee8;border-radius:22px;padding:7px 14px;color:#6b7a8c;font-size:11.5px}
.aBody{flex:1 1 auto;overflow:auto;padding:0 12px 80px}
.aCard{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(16,42,67,.14)}
.aCard b{font-size:12.6px;color:#12314f}
.aCard .kpi2{display:flex;gap:10px;margin-top:8px}
.aCard .kpi2 div{flex:1;background:#f2f6fb;border-radius:9px;padding:7px 9px}
.aCard .kpi2 .k{font-size:9.6px;color:#63788e;text-transform:uppercase;letter-spacing:.05em}
.aCard .kpi2 .v{font-size:17px;font-weight:bold;color:#0b2f56}
.aList{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #edf1f6;font-size:11.6px}
.aList:last-child{border-bottom:none}
.aList .ic{width:30px;height:30px;border-radius:8px;background:#e8f0fb;display:flex;align-items:center;justify-content:center;font-size:15px}
.aList .sp{flex:1}
.aNav{position:absolute;left:0;right:0;bottom:0;height:56px;background:#fff;border-top:1px solid #dfe5ec;display:flex}
.aNav button{flex:1;border:none;background:none;font:11px Tahoma;color:#5b6c7e;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center}
.aNav button .ic{font-size:18px}
.aNav button.on{color:#0b57d0;font-weight:bold}
.aFab{position:absolute;right:14px;bottom:66px;width:44px;height:44px;border-radius:50%;border:none;background:#0b57d0;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 10px rgba(11,87,208,.4)}
.aChip{display:inline-block;font-size:10px;border-radius:12px;padding:2px 8px;margin-right:4px}
@media (max-width:760px){ #desktop,#taskbar{display:none} #android{display:flex} }
</style>
</head>
<body>

<div id="desktop">
  <div id="wallpaperText">MENNN · Merit Royal Servis Platformu · Sistem Yöneticisi (XP Masaüstü Görünümü)</div>
</div>

<div id="ctxMenu"></div>

const S = {hotel:'H1', seq:100};
const SETTINGS = {mobileDefs:false, theme:'xp', confirm:true};

const WINS = []; let zTop = 100;
const isMobile = () => new URLSearchParams(location.search).get('mobil')==='1' || window.innerWidth<760;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

<script>
/* ============================================================================
   Pencere yöneticisi, onay pencereleri ve görünümler (Tanımlar + CRUD)
   ========================================================================= */
function xConfirm(title, msg, cb, ico){
  el('dlgTitle').textContent = title;
  el('dlgIco').textContent = ico || '❓';
  el('dlgMsg').innerHTML = msg;
  el('dlgWrap').style.display = 'block';
  el('dlgYes').onclick = function(){ el('dlgWrap').style.display='none'; cb(); };
  el('dlgNo').onclick  = function(){ el('dlgWrap').style.display='none'; };
}
function xToast(msg){
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:absolute;right:12px;bottom:40px;background:#ffffe1;border:1px solid #000;padding:8px 12px;font:11px Tahoma;z-index:9500;box-shadow:2px 2px 6px rgba(0,0,0,.4)';
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2600);
}
/* ---------------- pencere yöneticisi ---------------- */
function openWin(v){
  const def = VIEWS[v];
  if(!def){ xToast('Bu bileşen tanımlı değil.'); return; }
  if(isMobile()){ androidOpen(v); return; }
  let w = WINS.find(x=>x.v===v);
  if(w){ if(w.min) w.min=false; focusWin(w.id); renderWins(); return; }
  const id = 'w'+(++S.seq);
  WINS.push({id:id, v:v, x:40+((WINS.length%5)*26), y:34+((WINS.length%4)*22), w:def.w||640, h:def.h||440, min:false, max:false, z:++zTop});
  focusWin(id); renderWins();
}
function focusWin(id){ const w=WINS.find(x=>x.id===id); if(!w) return; w.z=++zTop; renderWins(); }
function closeWin(id){ const w=WINS.find(x=>x.id===id); xConfirm('Pencere kapat', '<b>'+esc(VIEWS[w.v].t)+'</b> penceresi kapatılacak. Kaydedilmemiş form girdileri kaybolur.', function(){ const i=WINS.findIndex(x=>x.id===id); if(i>=0) WINS.splice(i,1); renderWins(); xToast('Pencere kapatıldı.'); }, '✖'); }
function minWin(id){ const w=WINS.find(x=>x.id===id); if(w){ w.min=true; renderWins(); } }
function maxWin(id){ const w=WINS.find(x=>x.id===id); if(w){ w.max=!w.max; renderWins(); } }
function refreshWin(v){ const w=WINS.find(x=>x.v===v); if(w) renderWins(); }
function refreshAll(){ renderWins(); }
function renderWins(){
  const d = el('desktop');
  d.querySelectorAll('.win').forEach(function(x){ x.remove(); });
  let tasks = '';
  WINS.forEach(function(w){
    const def = VIEWS[w.v]; if(!def) return;
    const st = w.max ? 'left:0;top:0;width:100%;height:calc(100% - 30px);' :
      'left:'+w.x+'px;top:'+w.y+'px;width:'+w.w+'px;height:'+w.h+'px;';
    const div = document.createElement('div');
    div.className = 'win' + (w.min?' min':'') + (w.max?' max':'');
    div.id = w.id;
    div.style.cssText = st + 'z-index:' + w.z + ';';
    div.innerHTML =
      '<div class="tbar" onmousedown="dragStart(event,\''+w.id+'\')" ondblclick="maxWin(\''+w.id+'\')">'+
        '<span class="ic">'+def.ic+'</span><span>'+esc(def.t)+'</span><span class="sp"></span>'+
        '<button class="tbtn" onclick="minWin(\''+w.id+'\')">_</button>'+
        '<button class="tbtn" onclick="maxWin(\''+w.id+'\')">▢</button>'+
        '<button class="tbtn x" onclick="closeWin(\''+w.id+'\')">✕</button></div>'+
      '<div class="wbody" id="wb-'+w.id+'">'+def.r()+'</div>'+
      '<div class="wfoot"><span>'+esc(def.t)+'</span><span class="sp" style="flex:1"></span><span>otel: <b>'+esc(HN(S.hotel))+'</b></span><span>MENNN XP</span></div>'+
      (w.max?'':'<div class="resize" onmousedown="rsStart(event,\''+w.id+'\')"></div>');
    d.appendChild(div);
    if(def.after) def.after(div);
    tasks += '<div class="task'+(!w.min?' on':'')+'" onclick="taskClick(\''+w.id+'\')"><span>'+def.ic+'</span>'+esc(def.t)+'</div>';
  });
  el('tasks').innerHTML = tasks;
}
function taskClick(id){ const w=WINS.find(x=>x.id===id); if(!w) return; if(w.min){ w.min=false; focusWin(id); } else { w.min=true; renderWins(); } }
let drag=null, rsz=null;
function dragStart(e,id){
  const w=WINS.find(x=>x.id===id); if(!w || w.max) return;
  focusWin(id);
  drag={id:id, dx:e.clientX-w.x, dy:e.clientY-w.y};
  document.addEventListener('mousemove',dragMove); document.addEventListener('mouseup',dragEnd);
  e.preventDefault();
}
function dragMove(e){ if(!drag) return; const w=WINS.find(x=>x.id===drag.id); if(!w) return;
  w.x=Math.max(0,Math.min(window.innerWidth-120, e.clientX-drag.dx));
  w.y=Math.max(0,Math.min(window.innerHeight-70, e.clientY-drag.dy)); renderWins(); }
function dragEnd(){ drag=null; document.removeEventListener('mousemove',dragMove); document.removeEventListener('mouseup',dragEnd); }
function rsStart(e,id){ const w=WINS.find(x=>x.id===id); if(!w) return;
  rsz={id:id, x:e.clientX, y:e.clientY, w:w.w, h:w.h}; focusWin(id);
  document.addEventListener('mousemove',rsMove); document.addEventListener('mouseup',rsEnd); e.preventDefault(); e.stopPropagation(); }
function rsMove(e){ if(!rsz) return; const w=WINS.find(x=>x.id===rsz.id); if(!w) return;
  w.w=Math.max(340, rsz.w+(e.clientX-rsz.x)); w.h=Math.max(220, rsz.h+(e.clientY-rsz.y)); renderWins(); }
function rsEnd(){ rsz=null; document.removeEventListener('mousemove',rsMove); document.removeEventListener('mouseup',rsEnd); }

/* ---------------- ortak parçalar ---------------- */
function xHotelSel(id){
  return '<select class="xin" id="'+id+'">'+HOTELS.map(h=>'<option value="'+h.id+'"'+(h.id===S.hotel?' selected':'')+'>'+esc(h.name)+'</option>').join('')+'</select>';
}
function xHotelBar(fn){
  return '<div class="fld" style="display:flex;gap:8px;align-items:center;margin-bottom:9px">'+
    '<label class="fl" style="margin:0">Otel:</label><div style="width:200px">'+xHotelSel('xhSel')+'</div>'+
    '<button class="xbtn" onclick="'+fn+'">Getir</button>'+
    '<span class="tag">modül içinde otel seçimi — her otel ayrı sistem</span></div>';
}
function xReadHotel(){ const s=el('xhSel'); if(s) S.hotel=s.value; }
function xSetupWarn(){
  const ok = FLOORS.filter(f=>f.hotel===S.hotel).length>0 && ROOMS.filter(r=>r.hotel===S.hotel).length>0;
  return ok? '' : '<div class="note warn">⚠ Bu otelde <b>kat/oda tanımı eksik</b>. Tanımlar penceresinden önce tanımlamalar tamamlanmalıdır.</div>';
}

/* ---------------- görünümler ---------------- */
const VIEWS = {};
VIEWS['dashboard'] = {t:'Komuta Merkezi — Sistem Yöneticisi', ic:'🛰', w:700, h:460, r:function(){
  const chk = [
    ['Otel tanımları (3 standart kayıt)', HOTELS.length>=3],

  Modülleri kullanmadan önce <b>Tanımlar</b> penceresinden otel → kat → oda, oda tipi → konsept ve ürün tanımları tamamlanır.</div>
  ${HOTELS.map(h=>`
    <div class="h3"><span class="swatch2" style="display:inline-block;width:10px;height:10px;background:${h.theme};margin-right:5px"></span>${esc(h.name)} <span class="tag">${h.code}</span></div>
    <table class="xt">
      <tr><th>Minibar Takip</th><th>QR Menü</th><th>QR Sipariş</th><th>QR Oda Servisi</th><th>Kullanıcı</th></tr>
      <tr>
        <td>tüketim ${MODULE_DATA.minibar[h.id].cons} · zimmet ${MODULE_DATA.minibar[h.id].zimm}</td>
        <td>${MODULE_DATA.qrmenu[h.id].outlet} outlet · ${MODULE_DATA.qrmenu[h.id].item} öğe</td>
        <td>açık sipariş ${MODULE_DATA.qrsiparis[h.id].open} · adisyon ${MODULE_DATA.qrsiparis[h.id].adisyon}</td>
        <td>talep ${MODULE_DATA.oda[h.id].talep} · SLA ${MODULE_DATA.oda[h.id].sla}</td>
        <td>${USERS.filter(u=>u.scope.indexOf(h.name)>=0 || u.scope==='Kompleks').length}</td>
      </tr>
    </table>`).join('')}
  <div class="h3">Kurulum durumu</div>
  <table class="xt">${chk.map(c=>`<tr><td style="width:18px">${c[1]?'<b style="color:#1c6b1c">✓</b>':'<b style="color:#8c2318">•</b>'}</td><td>${esc(c[0])}</td>
    <td style="width:90px">${c[1]?'<span class="tag ok">tamam</span>':'<span class="tag warn">eksik</span>'}</td></tr>`).join('')}</table>
  <div style="margin-top:10px"><button class="xbtn pri" onclick="openWin('tanimlar')">📁 Tanımlar penceresini aç</button></div>`;
}};
/* ---------------- Tanımlar (gezgin) ---------------- */
const TANIM_TABS = [
  {k:'otel',   t:'Otel Tanımla',        ic:'🏨'},
  {k:'kat',    t:'Kat Tanımla',         ic:'▤'},
  {k:'oda',    t:'Oda Tanımla',         ic:'🚪'},
  {k:'odati',  t:'Oda Tipi Tanımla',    ic:'🏷'},

      <div style="padding:6px 8px;font-size:10px;color:#6b7a8c;border-top:1px solid #dfe5ee">Sıra: otel → kat → oda tipi/konsept → oda → ürün → kullanıcı</div>

function otelEdit(id){

function tanimKat(){

  <table class="xt">
    <tr><th>Kat</th><th>Ad</th><th>Oda sayısı</th><th></th></tr>
    ${list.map(f=>`<tr><td>${f.no}</td><td>${esc(f.name)}</td><td>${f.rooms}</td>
      <td><button class="xbtn" onclick="katDel('${f.id}')">Sil</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">Kat yok.</td></tr>'}

}
function katAdd(){
  const no = parseInt(el('kNo').value,10), nm = el('kName').value || (no+'. Kat');

  if(FLOORS.some(f=>f.hotel===S.hotel && f.no===no)){ xToast('Bu kat zaten tanımlı.'); return; }

function katDel(id){

  xConfirm('Kat silme', '<b>'+esc(f.name)+'</b> ve bağlı oda kayıtları silinecek. Bu işlem geri alınamaz. Onaylıyor musunuz?', function(){

<script>
/* ============================================================================
   Masaüstü simgeleri · Başlat menüsü · sağ tuş menüsü · sürükle-bırak ·
   Android mobil görünümü · başlatma

/* ---------------- masaüstü simgeleri ---------------- */
function renderIcons(){
  const d = el('desktop');
  d.querySelectorAll('.dicon').forEach(x=>x.remove());
  ICONS.forEach(function(ic, i){
    const div = document.createElement('div');
    div.className = 'dicon' + (ic.short?' short':'');
    div.id = ic.id;
    div.style.left = (10 + (i%2)*96) + 'px';
    div.style.top  = (10 + Math.floor(i/2)*84) + 'px';
    div.setAttribute('draggable','false');
    div.innerHTML = '<div class="ic">'+ic.ic+'</div><div class="lb">'+esc(ic.label)+'</div>';
    div.onclick = function(){ selectIcon(ic.id); };
    div.ondblclick = function(){ openWin(ic.v); };
    div.oncontextmenu = function(e){ e.preventDefault(); selectIcon(ic.id); iconMenu(e, ic); };
    d.appendChild(div);
  });
}
function selectIcon(id){
  document.querySelectorAll('.dicon').forEach(x=>x.classList.remove('sel'));
  const d = el(id); if(d) d.classList.add('sel');
}
function addShortcut(v, label, ic){
  if(ICONS.some(x=>x.v===v)){ xToast('Bu kısayol masaüstünde zaten var.'); return; }
  xConfirm('Kısayol ekleme', '<b>'+esc(label)+'</b> masaüstüne kısayol olarak eklenecek. Onaylıyor musunuz?', function(){
    ICONS.push({id:'i'+(++S.seq), v:v, label:label, ic:ic, short:true});
    renderIcons(); xToast('Kısayol eklendi: '+label);
  }, '🔗');
}
function removeShortcut(id){
  const ic = ICONS.find(x=>x.id===id);
  xConfirm('Kısayol kaldırma', '<b>'+esc(ic.label)+'</b> kısayolu masaüstünden kaldırılacak (pencere Başlat menüsünde kalır). Onaylıyor musunuz?', function(){
    ICONS = ICONS.filter(x=>x.id!==id);
    renderIcons(); xToast('Kısayol kaldırıldı: '+ic.label);
  }, '🗑');
}
/* ---------------- Başlat menüsü ---------------- */
const START = [
  {cat:'GENEL', items:[
    {v:'dashboard', t:'Komuta Merkezi', ic:'🛰'},
    {v:'tanimlar',  t:'Tanımlar',       ic:'📁'},
    {v:'raporlar',  t:'Raporlar',       ic:'📈'},
    {v:'ayarlar',   t:'Ayarlar',        ic:'⚙'}
  ]},
  {cat:'MİNİBAR TAKİP (MODÜL SİSTEMİ)', items:[{v:'minibar', t:'Minibar Takip', ic:'📦'}]},
  {cat:'QR MENÜ (MODÜL SİSTEMİ)',       items:[{v:'qrmenu', t:'QR Menü', ic:'🍽'}]},
  {cat:'QR SİPARİŞ (MODÜL SİSTEMİ)',    items:[{v:'qrsiparis', t:'QR Sipariş', ic:'🛎'}]},
  {cat:'QR ODA SERVİSİ (MODÜL SİSTEMİ)',items:[{v:'oda', t:'QR Oda Servisi', ic:'🛏'}]}
];
const START_RIGHT = [
  {v:'dashboard', t:'Komuta Merkezi', ic:'🛰'},
  {v:'raporlar',  t:'Raporlar',       ic:'📈'},
  {v:'ayarlar',   t:'Ayarlar',        ic:'⚙'},
  {v:'tanimlar',  t:'Tanımlar',       ic:'📁'}
];
function buildStart(){
  el('smLeft').innerHTML = START.map(g=>
    '<div class="smCat">'+g.cat+'</div>' +
    g.items.map(it=>
      '<div class="smItem" draggable="true" ondragstart="smDrag(event,\''+it.v+'\',\''+esc(it.t)+'\',\''+it.ic+'\')" '+
      'onclick="openWin(\''+it.v+'\');xStartClose()">'+
      '<span class="ic">'+it.ic+'</span><span>'+esc(it.t)+'</span>'+
      (ICONS.some(x=>x.v===it.v)?'<span class="pin">masaüstünde</span>':'')+'</div>').join('')
  ).join('');
  el('smRight').innerHTML = '<div class="smCat">YER İMLERİ</div>' + START_RIGHT.map(it=>
    '<div class="smItem" onclick="openWin(\''+it.v+'\');xStartClose()"><span class="ic">'+it.ic+'</span><span>'+esc(it.t)+'</span></div>').join('');
}
function smDrag(e, v, label, ic){ e.dataTransfer.setData('text/plain', v+'|'+label+'|'+ic); }
function xStartToggle(){ const m=el('startMenu'); m.classList.toggle('open'); if(m.classList.contains('open')) buildStart(); }
function xStartClose(){ el('startMenu').classList.remove('open'); el('ctxMenu').style.display='none'; }
/* ---------------- sağ tuş menüsü ---------------- */
function ctxShow(e, items){
  const m = el('ctxMenu');
  m.innerHTML = items.map(it=> it.sep ? '<div class="sep"></div>' :
    '<div class="ci'+(it.dis?' dis':'')+'" onclick="'+(it.fn||'')+'">'+(it.ic||'')+' '+esc(it.t)+'</div>').join('');
  m.style.display='block';
  m.style.left = Math.min(e.clientX, window.innerWidth-200) + 'px';
  m.style.top  = Math.min(e.clientY, window.innerHeight-200) + 'px';
}
function desktopMenu(e){
  e.preventDefault();
  ctxShow(e, [
    {t:'Yenile', ic:'🔄', fn:'xRefreshDesktop()'},
    {sep:true},
    {t:'Arka plan rengi — Windows XP Mavi', ic:'🎨', fn:'setTheme(\'xp\')'},
    {t:'Arka plan rengi — Yeşil Tepeler', ic:'🎨', fn:'setTheme(\'green\')'},
    {t:'Arka plan rengi — Kurumsal Gri', ic:'🎨', fn:'setTheme(\'slate\')'},
    {t:'Arka plan rengi — Koyu', ic:'🎨', fn:'setTheme(\'dark\')'},
    {sep:true},
    {t:'Simgeleri hizala (sol üst)', ic:'📐', fn:'renderIcons();xToast(\'Simgeler hizalandı.\')'},
    {t:'Yeni kısayol — Başlat menüsünden sürükleyin', ic:'🔗', dis:true}
  ]);
}
function iconMenu(e, ic){
  ctxShow(e, [
    {t:'Aç', ic:ic.ic, fn:'openWin(\''+ic.v+'\');xStartClose()'},
    {sep:true},
    {t:'Masaüstünden Kaldır', ic:'🗑', fn:'removeShortcut(\''+ic.id+'\')'},
    {t:'Özellikler', ic:'ℹ', fn:'xToast(\''+esc(ic.label)+' · MENNN kısayolu\')'}
  ]);
}
function xRefreshDesktop(){
  xConfirm('Masaüstünü yenile', 'Masaüstü simgeleri ve açık pencereler yenilenecek. Onaylıyor musunuz?', function(){
    renderIcons(); renderWins(); xToast('Masaüstü yenilendi.');
  }, '🔄');
}
document.addEventListener('click', function(e){
  if(!e.target.closest('#startMenu') && !e.target.closest('#startBtn')) xStartClose();
  if(!e.target.closest('#ctxMenu')) el('ctxMenu').style.display='none';
  if(!e.target.closest('.dicon')) document.querySelectorAll('.dicon.sel').forEach(x=>x.classList.remove('sel'));
});
document.addEventListener('contextmenu', function(e){
  if(e.target.closest('#desktop') && !e.target.closest('.win') && !e.target.closest('.dicon')) desktopMenu(e);
});
/* masaüstüne sürükle-bırak */
window.addEventListener('DOMContentLoaded', function(){
  const d = el('desktop');
  d.addEventListener('dragover', function(e){ e.preventDefault(); });
  d.addEventListener('drop', function(e){
    e.preventDefault();
    const data = (e.dataTransfer.getData('text/plain')||'').split('|');
    if(data.length>=3) addShortcut(data[0], data[1], data[2]);
  });
});
/* ---------------- Android mobil görünümü ---------------- */

}
function androidRender(){

  S.aTab = map[v]; androidRender();
}
function xAndroidFab(){ xConfirm('Hızlı yenileme', 'İzleme verileri yenilenecek. Onaylıyor musunuz?', function(){ androidRender(); xToast('Veriler yenilendi.'); }, '🔄'); }
/* ---------------- başlatma ---------------- */
(function(){
  applyTheme();
  renderIcons();
  buildStart();
  renderWins();
  function tick(){ const d=new Date(); const t=d.toTimeString().slice(0,5);
    el('xClock').textContent=t; const a=el('aClock'); if(a) a.textContent=t; }
  tick(); setInterval(tick, 15000);
  androidInit();
  window.addEventListener('resize', function(){ if(isMobile() && !el('android').classList.contains('on')) androidInit(); });
  xToast('MENNN XP hazır — simgelere çift tıklayın veya Başlat menüsünü kullanın.');
})();
</script>
