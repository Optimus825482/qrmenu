<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F&amp;B Command Center — İlerleme</title>
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --bg: #f4f6fa; --surface: #ffffff; --border: #dfe4ec; --text: #0f172a; --muted: #5b6676;
    --brand: #0f172a; --accent: #2563eb; --gold: #947833; --ok: #15803d; --ok-bg: #dcfce7;
    --warn: #b45309; --warn-bg: #fef3c7; --pend: #94a3b8; --pend-bg: #f1f5f9; --bar: #e2e8f0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1220; --surface: #121a2b; --border: #243049; --text: #e6ecf5; --muted: #9aa7bb;
      --brand: #e6ecf5; --accent: #60a5fa; --gold: #d4b36a; --ok: #4ade80; --ok-bg: #0f2e1c;
      --warn: #fbbf24; --warn-bg: #3a2a08; --pend: #64748b; --pend-bg: #1a2336; --bar: #243049;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1220; --surface: #121a2b; --border: #243049; --text: #e6ecf5; --muted: #9aa7bb;
    --brand: #e6ecf5; --accent: #60a5fa; --gold: #d4b36a; --ok: #4ade80; --ok-bg: #0f2e1c;
    --warn: #fbbf24; --warn-bg: #3a2a08; --pend: #64748b; --pend-bg: #1a2336; --bar: #243049;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  h1 small { color: var(--gold); font-weight: 600; font-size: 13px; margin-left: 8px; }
  .meta { color: var(--muted); font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .total { display: grid; grid-template-columns: 1fr auto; gap: 12px 20px; align-items: center; }
  .pct { font-size: 40px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .pct small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 6px; }
  .bar { height: 14px; background: var(--bar); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--ok)); border-radius: 999px; transition: width .6s ease; }
  .bar.small { height: 8px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 13px; margin-top: 8px; }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
  .phase { padding: 0; overflow: hidden; }
  .phase > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 8px 14px; align-items: center; }
  .phase > summary::-webkit-details-marker { display: none; }
  .phase > summary .name { font-weight: 600; }
  .phase > summary .sub { color: var(--muted); font-size: 13px; }
  .phase .bar { grid-column: 1 / -1; }
  .chip { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .chip.done { background: var(--ok-bg); color: var(--ok); }
  .chip.active { background: var(--warn-bg); color: var(--warn); }
  .chip.pending { background: var(--pend-bg); color: var(--muted); }
  .chip.weight { background: var(--pend-bg); color: var(--muted); font-weight: 500; }
  ul.tasks { list-style: none; margin: 0; padding: 0 16px 14px; border-top: 1px solid var(--border); }
  ul.tasks li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: start; padding: 9px 0; border-bottom: 1px dashed var(--border); }
  ul.tasks li:last-child { border-bottom: 0; }
  .tick { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; margin-top: 2px; }
  .tick.done { background: var(--ok); color: #fff; }
  .tick.active { background: var(--warn); color: #fff; }
  .tick.pending { border: 2px solid var(--pend); color: transparent; }
  .task-title { font-weight: 500; }
  .task-note { color: var(--muted); font-size: 13px; }
  .task-when { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 13px; margin: 6px 0 14px; align-items: center; }
  .legend .tick { width: 16px; height: 16px; font-size: 10px; }
  .log { font-size: 13px; color: var(--muted); }
  .log li { margin: 4px 0; }
  .log time { color: var(--text); font-variant-numeric: tabular-nums; margin-right: 8px; }
  .toolbar { display: flex; gap: 8px; align-items: center; }
  button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .countdown { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  @media (max-width: 600px) { .pct { font-size: 32px; } .total { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>F&amp;B Command Center — Proje İlerlemesi <small>Merit Royal Hotels &amp; Resorts</small></h1>
    <div class="toolbar">
      <span class="countdown" id="countdown"></span>
      <button type="button" id="refresh">Yenile</button>
      <button type="button" id="toggleTheme" title="Tema">◐</button>
    </div>
  </header>

  <section class="card total" aria-label="Genel ilerleme">
    <div>
      <div class="pct"><span id="pct">0</span>%<small id="pctLabel">tamamlandı</small></div>
      <div class="bar" style="margin-top:10px"><span id="pctBar"></span></div>
      <div class="stats">
        <span>Görev: <b id="statDone">0</b> / <b id="statTotal">0</b></span>
        <span>Devam eden: <b id="statActive">0</b></span>
        <span>Faz: <b id="statPhases">0</b></span>
        <span>Son güncelleme: <b id="updated">—</b></span>
      </div>
    </div>
    <div class="meta" id="headline"></div>
  </section>

  <div class="legend">
    <span><span class="tick done">✓</span> Tamamlandı</span>
    <span><span class="tick active">▶</span> Devam ediyor</span>
    <span><span class="tick pending"></span> Bekliyor</span>
    <span>Yüzde, fazların plan ağırlığına göre hesaplanır (faz içinde görevler eşit sayılır).</span>
  </div>

  <div id="phases"></div>

  <section class="card">
    <h2 style="font-size:16px;margin:0 0 8px">Günlük</h2>
    <ul class="log" id="log"></ul>
  </section>
</div>

<script src="ilerleme-data.js"></script>
<script>
(function () {
  var REFRESH_SEC = 60;
  var data = window.ILERLEME;
  if (!data) { document.getElementById('headline').textContent = 'ilerleme-data.js yüklenemedi.'; return; }

  function statusOf(t) { return t.status === 'done' ? 'done' : t.status === 'active' ? 'active' : 'pending'; }
  function phasePct(p) {
    if (!p.tasks || !p.tasks.length) return p.status === 'done' ? 100 : 0;
    var score = 0;
    p.tasks.forEach(function (t) { score += statusOf(t) === 'done' ? 1 : statusOf(t) === 'active' ? 0.5 : 0; });
    return Math.round(100 * score / p.tasks.length);
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var totalW = 0, got = 0, done = 0, total = 0, active = 0;
  data.phases.forEach(function (p) {
    totalW += p.weight; got += p.weight * phasePct(p) / 100;
    (p.tasks || []).forEach(function (t) { total++; if (statusOf(t) === 'done') done++; else if (statusOf(t) === 'active') active++; });
  });
  var pct = totalW ? Math.round(100 * got / totalW) : 0;
  document.getElementById('pct').textContent = pct;
  document.getElementById('pctBar').style.width = pct + '%';
  document.getElementById('statDone').textContent = done;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statActive').textContent = active;
  document.getElementById('statPhases').textContent = data.phases.filter(function (p) { return phasePct(p) === 100; }).length + ' / ' + data.phases.length;
  document.getElementById('updated').textContent = data.updatedAt || '—';
  document.getElementById('headline').textContent = data.headline || '';
  document.title = 'F&B Command Center — İlerleme %' + pct;

  var host = document.getElementById('phases');
  data.phases.forEach(function (p) {
    var pp = phasePct(p);
    var st = pp === 100 ? 'done' : pp > 0 ? 'active' : 'pending';
    var det = document.createElement('details');
    det.className = 'card phase';
    det.open = st === 'active';
    var tasksHtml = (p.tasks || []).map(function (t) {
      var s = statusOf(t);
      return '<li><span class="tick ' + s + '">' + (s === 'done' ? '✓' : s === 'active' ? '▶' : '') + '</span>' +
        '<div><div class="task-title">' + esc(t.title) + '</div>' + (t.note ? '<div class="task-note">' + esc(t.note) + '</div>' : '') + '</div>' +
        '<span class="task-when">' + esc(t.doneAt || (s === 'active' ? 'devam' : '')) + '</span></li>';
    }).join('');
    det.innerHTML =
      '<summary>' +
        '<span class="chip ' + st + '">' + (st === 'done' ? 'Tamamlandı' : st === 'active' ? 'Devam ediyor' : 'Bekliyor') + '</span>' +
        '<span><span class="name">' + esc(p.code) + ' · ' + esc(p.title) + '</span><br><span class="sub">' + esc(p.summary || '') + '</span></span>' +
        '<span><span class="chip weight">%' + p.weight + ' ağırlık</span> &nbsp; <b style="font-variant-numeric:tabular-nums">%' + pp + '</b></span>' +
        '<div class="bar small"><span style="width:' + pp + '%"></span></div>' +
      '</summary>' +
      (tasksHtml ? '<ul class="tasks">' + tasksHtml + '</ul>' : '');
    host.appendChild(det);
  });

  var log = document.getElementById('log');
  (data.log || []).slice().reverse().forEach(function (e) {
    var li = document.createElement('li');
    li.innerHTML = '<time>' + esc(e.at) + '</time>' + esc(e.text);
    log.appendChild(li);
  });

  var left = REFRESH_SEC, cd = document.getElementById('countdown');
  setInterval(function () { left--; cd.textContent = left + ' sn sonra yenilenir'; if (left <= 0) location.reload(); }, 1000);
  document.getElementById('refresh').addEventListener('click', function () { location.reload(); });

  var root = document.documentElement;
  try { var saved = localStorage.getItem('ilerleme.theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
  document.getElementById('toggleTheme').addEventListener('click', function () {
    var cur = root.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('ilerleme.theme', next); } catch (e) {}
  });
})();
</script>
</body>
</html>
